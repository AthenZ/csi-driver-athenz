apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "csi-driver-athenz.name" . }}-approver
  namespace: {{ .Release.Namespace }}
  labels:
{{ include "csi-driver-athenz.labels" . | indent 4 }}
spec:
  replicas: {{ .Values.app.approver.replicaCount }}
  selector:
    matchLabels:
      app: {{ include "csi-driver-athenz.name" . }}-approver
  template:
    metadata:
      labels:
        app: {{ include "csi-driver-athenz.name" . }}-approver
        {{- include "csi-driver-athenz.labels" . | nindent 8 }}
    spec:
      serviceAccountName: {{ include "csi-driver-athenz.name" . }}-approver
      containers:
      - name: {{ include "csi-driver-athenz.name" . }}-approver
        image: "{{ template "image-approver" (tuple .Values.image $.Chart.AppVersion) }}"
        imagePullPolicy: {{ .Values.image.pullPolicy }}
        ports:
        - containerPort: {{ .Values.app.approver.metrics.port }}
        readinessProbe:
          httpGet:
            port: {{ .Values.app.approver.readinessProbe.port }}
            path: "/readyz"
          initialDelaySeconds: 3
          periodSeconds: 7
        args:
          - --log-level={{ .Values.app.logLevel }}
          - --csi-driver-name={{ .Values.app.name }}

          - --certificate-request-duration={{ .Values.app.certificateRequestDuration }}
          - --issuer-name={{ .Values.app.issuer.name }}
          - --issuer-kind={{ .Values.app.issuer.kind }}
          - --issuer-group={{ .Values.app.issuer.group }}
          - --trust-domain={{ .Values.app.trustDomain }}

          - --leader-election-namespace=$(POD_NAMESPACE)
          - --multi-tenancy={{ .Values.app.approver.multiTenant }}
          - "--metrics-bind-address=:{{.Values.app.approver.metrics.port}}"
          - "--readiness-probe-bind-address=:{{.Values.app.approver.readinessProbe.port}}"
          {{- with .Values.app.approver.kubeApiQPS }}
          {{- if lt (float64 .) 0.0 }}
          {{- fail "app.approver.kubeApiQPS must be >= 0" }}
          {{- end }}
          - --kube-api-qps={{ . }}
          {{- end }}
          {{- with .Values.app.approver.kubeApiBurst }}
          {{- if or (lt (float64 .) 0.0) (ne (float64 .) (float64 (int .))) }}
          {{- fail "app.approver.kubeApiBurst must be an integer >= 0" }}
          {{- end }}
          - --kube-api-burst={{ . | int }}
          {{- end }}
          {{- with .Values.app.approver }}
          {{- if not (kindIs "invalid" .maxConcurrentReconciles) }}
          {{- if or (lt (float64 .maxConcurrentReconciles) 1.0) (ne (float64 .maxConcurrentReconciles) (float64 (int .maxConcurrentReconciles))) }}
          {{- fail "app.approver.maxConcurrentReconciles must be an integer >= 1" }}
          {{- end }}
          - --max-concurrent-reconciles={{ .maxConcurrentReconciles | int }}
          {{- end }}
          {{- end }}
        env:
        - name: POD_NAMESPACE
          valueFrom:
            fieldRef:
              fieldPath: metadata.namespace
        resources:
{{- toYaml .Values.app.approver.resources | nindent 12 }}
      {{- with .Values.priorityClassName }}
      priorityClassName: {{ . | quote }}
      {{- end }}
      {{- with (.Values.app.approver.nodeSelector | default .Values.nodeSelector) }}
      nodeSelector:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with (.Values.app.approver.affinity | default .Values.affinity) }}
      affinity:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with (.Values.app.approver.tolerations | default .Values.tolerations) }}
      tolerations:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with  .Values.topologySpreadConstraints }}
      topologySpreadConstraints:
        {{- toYaml . | nindent 8 }}
      {{- end }}
